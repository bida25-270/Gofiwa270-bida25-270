<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Checkout</h1>
  <div class="summary">
    <h2>Order Summary</h2>
    <div id="order-summary"></div>
    <div id="order-total"></div>
  </div>
  <div class="details">
    <h2>Customer Details</h2>
    <form id="checkout-form">
      <label>Name:</label><input type="text" required>
      <label>Email:</label><input type="email" required>
      <label>Address:</label><textarea required></textarea>
      <label>Payment Method:</label>
      <select required>
        <option value="card">Credit Card</option>
        <option value="paypal">PayPal</option>
        <option value="other">Other</option>
      </select>
      <button type="submit">Place Order</button>
    </form>
    <div id="confirmation"></div>
  </div>

  <script>
    const summary = document.getElementById('order-summary');
    const totalDiv = document.getElementById('order-total');
    const cart = JSON.parse(localStorage.getItem('cart')) || [];

    let total = 0;
    cart.forEach(item => {
      const subtotal = item.price * item.quantity;
      total += subtotal;
      summary.innerHTML += `
        <div class="summary-item">
          <img src="${item.image}" alt="${item.name}">
          <div>
            <p>${item.name}</p>
            <p>Qty: ${item.quantity}</p>
            <p>Subtotal: P${subtotal}</p>
          </div>
        </div>
      `;
    });
    totalDiv.textContent = 'Total: P' + total.toFixed(2);

    document.getElementById('checkout-form').onsubmit = (e) => {
      e.preventDefault();
      localStorage.removeItem('cart');
      summary.innerHTML = '';
      totalDiv.textContent = '';
      document.getElementById('confirmation').textContent = 'Thank you! Your order has been placed.';
    };
  </script>
</body>
</html>
